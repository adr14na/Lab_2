<!DOCTYPE html>
<html lang="en">
<head>
    <title>Conference Registration Form</title>
</head>
<body>
    <h3>Conference Registration Form</h3>

    <form action="">
        Full Name: <br>
        <input type="text" name="fullname"
        placeholder="Enter your full name">
        <br>

        Email Address: <br>
        <input type="email" name="email"
        placeholder="Enter your email address">
        <br>

        Age: <br>
        <input type="number" name="age"
        placeholder="Enter your age" size="3">
        <br><br>

        Gender: <br>
        <input type="radio" name="gender" value="Male"> Male
        <br>
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        Country of Residence: <br>
        <select name="country">
            <option value="Malaysia">Malaysia</option>
            <option value="Singapore">Singapore</option>
            <option value="Indonesia">Indonesia</option>
            <option value="Thailand">Thailand</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        Areas of Interest: <br>
        <input type="checkbox" name="interest" value="Software Development">
        Software Development <br>
        <input type="checkbox" name="interest" value="Data Science">
        Data Science <br>
        <input type="checkbox" name="interest" value="Cybersecurity">
        Cybersecurity <br>
        <input type="checkbox" name="interest" value="Artificial Intelligence">
        Artificial Intelligence
        <br><br>

        Experience Level: <br>
        <input type="radio" name="experience" value="Beginner">
        Beginner <br>
        <input type="radio" name="experience" value="Intermediate">
        Intermediate <br>
        <input type="radio" name="experience" value="Advanced">
        Advanced
        <br><br>

        Comments or Questions: <br>
        <textarea name="comments" rows="4" cols="40"
        placeholder="Any comments or questions?"></textarea>
        <br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
